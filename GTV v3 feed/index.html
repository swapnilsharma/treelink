<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTV V3 Feed Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app-root">
      <div class="layer-container layer--0" data-layer-id="0">
        <div class="card-track">
          <div class="card-layer" data-card-slot="prev">
            <div class="card-bg" aria-hidden="true"></div>
            <div class="layer0-hero layer0-cta-container">
              <div class="hero-text">
                <p class="hero-label"></p>
                <h1 class="hero-title"></h1>
              </div>
              <div class="cta-tray-viewport">
                <div class="cta-tray">
                  <button class="cta-tile cta-mic">
                    <img src="src/icn/icn-mic.svg" alt="" />
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="card-layer" data-card-slot="current">
            <div class="card-bg" aria-hidden="true"></div>
            <div class="layer0-hero layer0-cta-container">
              <div class="hero-text">
                <p class="hero-label"></p>
                <h1 class="hero-title"></h1>
              </div>
              <div class="cta-tray-viewport">
                <div class="cta-tray">
                  <button class="cta-tile cta-mic">
                    <img src="src/icn/icn-mic.svg" alt="" />
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="card-layer" data-card-slot="next">
            <div class="card-bg" aria-hidden="true"></div>
            <div class="layer0-hero layer0-cta-container">
              <div class="hero-text">
                <p class="hero-label"></p>
                <h1 class="hero-title"></h1>
              </div>
              <div class="cta-tray-viewport">
                <div class="cta-tray">
                  <button class="cta-tile cta-mic">
                    <img src="src/icn/icn-mic.svg" alt="" />
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="bottom-gradient-overlay"></div>
      </div>

      <!-- Layer -2: Settings cluster -->
      <div class="layer-container layer--minus2" data-layer-id="-2">
        <div class="settings-cluster">
          <div class="settings-item settings-chip">
            <span class="chip-icon">☀️</span>
            <span class="chip-text">31° Mostly Sunny</span>
          </div>
          <div class="settings-item settings-chip">
            Tue, 8 Jul · 09:30 AM
          </div>
          <div
            class="settings-item settings-gear focusable"
            data-layer="-2"
            data-index="0"
            tabindex="-1"
            aria-label="Settings"
          >
            <img class="gear-icon" src="src/icn/icn-Gear.svg" alt="Settings" />
          </div>
        </div>
      </div>

      <!-- Layer -1: Navigation bar -->
      <div class="layer-container layer--minus1" data-layer-id="-1">
        <div class="nav-bar">
          <button class="nav-arrow focusable" data-layer="-1" data-index="0" data-nav="prev" aria-label="Previous card">
            <img src="src/icn/icn-previous-story.svg" alt="" />
          </button>
          <button class="nav-arrow focusable" data-layer="-1" data-index="1" data-nav="next" aria-label="Next card">
            <img src="src/icn/icn-next-story.svg" alt="" />
          </button>
        </div>
      </div>

      <!-- Layer 1: Bottom tray (tabs + rail) -->
      <div class="layer-container layer--1" data-layer-id="1">
        <div class="bottom-container" id="bottom-container">
          <div class="tabs-row tabs-bar">
            <span class="tabs-arrow" aria-hidden="true">▲</span>
            <div class="tabs">
              <button class="tab focusable" data-layer="1" data-index="0" data-tab="Discover">
                Discover
              </button>
            <button class="tab focusable" data-layer="1" data-index="1" data-tab="Shop">
              Shop
            </button>
            <button class="tab focusable" data-layer="1" data-index="2" data-tab="More">
              More
            </button>
          </div>
          </div>
          <div class="rail-container" id="rail-container" aria-live="polite"></div>
        </div>
      </div>

      <!-- Settings overlay + panel -->
      <div class="settings-overlay" id="settings-overlay"></div>
      <aside class="settings-panel" id="settings-panel" aria-hidden="true">
        <h2 class="settings-title">Settings</h2>
        <ul class="settings-list">
          <li class="settings-option focusable" data-layer="settings" data-index="0">Account</li>
          <li class="settings-option focusable" data-layer="settings" data-index="1">Preferences</li>
          <li class="settings-option focusable" data-layer="settings" data-index="2">About</li>
          <li class="settings-option focusable" data-layer="settings" data-index="3">Help</li>
        </ul>
      </aside>
    </div>

    <script src="app.js"></script>
  </body>
</html>
